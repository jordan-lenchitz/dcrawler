worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    # Trust the rightmost X-Forwarded-For IP appended by Cloud Run edge (recursive off prevents client spoofing)
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Per-IP WebSocket concurrency (max 5) and HTTP request rate limiting
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=http_per_ip:10m rate=5r/s;
    limit_conn_status 429;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map "$http_origin|$http_host" $ws_origin_ok {
        default __ORIGIN_DEFAULT__;
        "~^https?://([^/|]+)\|\1$" 1;
    }

    upstream ttyd_backend {
        server 127.0.0.1:__TTYD_PORT__;
    }

    server {
        listen __PORT__;
        listen [::]:__PORT__;
        server_name _;

        include /app/config/security-headers.conf;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            access_log off;
            include /app/config/security-headers.conf;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 200 "ok\n";
        }

        location = / {
            limit_req zone=http_per_ip burst=15 nodelay;
            proxy_pass http://ttyd_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /token {
            limit_req zone=http_per_ip burst=15 nodelay;
            include /app/config/security-headers.conf;
            add_header Cache-Control "no-store" always;
            proxy_pass http://ttyd_backend/token;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /ws {
            if ($ws_origin_ok = 0) {
                return 403;
            }
            limit_conn ws_per_ip 5;
            limit_req zone=http_per_ip burst=10 nodelay;
            proxy_pass http://ttyd_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
